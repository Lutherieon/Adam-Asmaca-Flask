<!DOCTYPE html>
<html>
<head>
    <title>Görsel Adam Asmaca</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <svg id="hangman" width="200" height="250">
            <line x1="20" y1="230" x2="180" y2="230" stroke="white" stroke-width="4" />
            <line x1="40" y1="230" x2="40" y2="20" stroke="white" stroke-width="4" />
            <line x1="40" y1="20" x2="120" y2="20" stroke="white" stroke-width="4" />
            <line x1="120" y1="20" x2="120" y2="50" stroke="white" stroke-width="4" />
            
            <circle id="head" cx="120" cy="70" r="20" class="part" />
            <line id="body" x1="120" y1="90" x2="120" y2="150" class="part" />
            <line id="armL" x1="120" y1="110" x2="90" y2="130" class="part" />
            <line id="armR" x1="120" y1="110" x2="150" y2="130" class="part" />
            <line id="legL" x1="120" y1="150" x2="90" y2="190" class="part" />
            <line id="legR" x1="120" y1="150" x2="150" y2="190" class="part" />
        </svg>

        <div id="word-box" class="word-display"></div>
        
        <div id="keyboard"></div>
        <p id="status"></p>
        
        <button id="reset-btn" onclick="location.reload()">Yeniden Başlat</button>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
